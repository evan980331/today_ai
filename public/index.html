<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Today AI - OpenCode Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    <style>
        * { min-width: 0; }
        html, body { overflow-x: hidden; }
        pre, code { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; max-width: 100%; }
        #chat-container::-webkit-scrollbar { width: 6px; }
        /* 禁止 double-tap zoom 但保留 pinch zoom */
        button, a, [onclick] { touch-action: manipulation; }
        /* 防止 iOS 鍵盤聚焦自動放大：input 需 >=16px */
        @media (max-width: 768px) {
            #user-input, #login-username, #login-password { font-size: 16px !important; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex overflow-hidden" style="height:100dvh; height:100vh; min-height:0">
    <!-- 登入畫面 -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 w-full max-w-sm shadow-2xl">
            <div class="flex items-center space-x-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white">T</div>
                <div>
                    <h2 class="text-lg font-bold">Today AI 登入</h2>
                    <p class="text-xs text-slate-400">請輸入帳號與密碼</p>
                </div>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-400">帳號</label>
                    <input id="login-username" type="text" autocomplete="username" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-indigo-500" placeholder="username">
                </div>
                <div>
                    <label class="text-xs text-slate-400">密碼</label>
                    <input id="login-password" type="password" autocomplete="current-password" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-indigo-500" placeholder="password">
                </div>
                <div id="login-error" class="text-xs text-red-400 hidden"></div>
                <button onclick="doLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition">登入</button>
            </div>
        </div>
    </div>

    <!-- 手機遮罩 -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden" onclick="toggleSidebar()"></div>
    <!-- 側邊欄 -->
    <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 hidden md:flex fixed md:static inset-y-0 left-0 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-200 overflow-y-auto">
        <div>
            <div class="flex items-center space-x-3 px-2 mb-6">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">T</div>
                <span class="text-lg font-bold tracking-wide">Today AI</span>
            </div>
            <button onclick="toggleNewAgentForm()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-xl flex items-center justify-center space-x-2 transition mb-4 shadow-lg shadow-indigo-600/20 min-h-[44px]">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>New Agent</span>
            </button>
            <div id="new-agent-form" class="hidden mb-4 p-3 rounded-xl bg-slate-800/60 border border-slate-700 space-y-2">
                <input id="new-agent-name" type="text" maxlength="40" placeholder="名稱（例如：Review）" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500 min-h-[44px]">
                <input id="new-agent-icon" type="text" maxlength="8" placeholder="圖示（例如：🤖）" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500 min-h-[44px]">
                <input id="new-agent-desc" type="text" maxlength="120" placeholder="描述（選填）" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500 min-h-[44px]">
                <div class="flex gap-2">
                    <button onclick="toggleNewAgentForm()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm py-2 rounded-lg min-h-[44px]">取消</button>
                    <button onclick="createAgentSpace()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-sm py-2 rounded-lg min-h-[44px]">建立</button>
                </div>
            </div>
            <div class="flex items-center justify-between px-2 mb-2">
                <span class="text-xs font-semibold text-slate-400 tracking-wider">Agent Spaces</span>
            </div>
            <div id="space-list" class="space-y-1 overflow-y-auto max-h-[50vh] pr-1 mb-3">
                <div class="text-xs text-slate-500 px-2 py-2">載入中...</div>
            </div>
        </div>
    </aside>

    <!-- 主區域 -->
    <main class="flex-1 flex flex-col h-full bg-slate-950 relative min-w-0 overflow-hidden">
        <header class="h-16 border-b border-slate-800/60 flex items-center justify-between px-4 md:px-6 bg-slate-950/80 backdrop-blur shrink-0 relative z-20">
            <div class="flex items-center gap-2 md:hidden relative z-30">
                <button onclick="toggleSidebar()" type="button" class="p-2 rounded-lg hover:bg-slate-800 text-slate-400 min-w-[44px] min-h-[44px] flex items-center justify-center pointer-events-auto relative z-30" aria-label="選單">
                    <i data-lucide="menu" class="w-5 h-5">☰</i>
                </button>
                <span id="active-space-icon" class="text-base leading-none">🏠</span>
                <span id="active-space-name" class="font-bold text-sm">General</span>
            </div>
            <div class="hidden md:flex items-center space-x-2 text-sm text-slate-400">
                <span id="current-date"></span>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="doLogout()" class="text-xs px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">登出</button>
            </div>
        </header>

        <!-- 對話/卡片區 -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 max-w-3xl w-full mx-auto space-y-4 md:space-y-6 min-w-0">
            <div id="welcome-section" class="text-center my-8 space-y-3 px-2">
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-100">開始與 Today AI 對話</h1>
                <p class="text-slate-400 text-sm">選擇左側 Agent Space，或直接輸入訊息開始。</p>
            </div>

            <div id="messages" class="space-y-4"></div>
        </div>

        <!-- 輸入框 -->
        <div class="p-3 md:p-4 max-w-3xl w-full mx-auto shrink-0" style="padding-bottom:max(0.75rem,env(safe-area-inset-bottom))">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-2 shadow-2xl focus-within:border-indigo-500/50 transition">
                <textarea id="user-input" rows="2" placeholder="輸入指令，例如：『重構 src/server.js 程式碼，增加日誌記錄』..." class="w-full bg-transparent text-slate-100 placeholder-slate-500 resize-none outline-none px-3 pt-2 text-sm min-w-0 break-words"></textarea>
                <div class="flex items-center justify-between pt-2 border-t border-slate-800/50 px-2 gap-2">
                    <span class="text-xs text-slate-500 hidden sm:inline">提示：Enter 發送，Shift+Enter 換行</span>
                    <span class="text-xs text-slate-500 sm:hidden">Enter 發送</span>
                    <button type="button" id="stop-button" onclick="stopExecution()" class="bg-red-600 hover:bg-red-500 text-white p-2 rounded-xl transition items-center justify-center shrink-0 min-w-[44px] min-h-[44px] touch-manipulation pointer-events-auto relative z-10" style="display:none" aria-label="終止">
                        <i data-lucide="square" class="w-4 h-4">■</i>
                    </button>
                    <button type="button" id="send-button" onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-xl transition flex items-center justify-center shrink-0 min-w-[44px] min-h-[44px] touch-manipulation pointer-events-auto relative z-10">
                        <i data-lucide="arrow-up" class="w-4 h-4">↑</i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="/app.js" defer></script>
</body>
</html>
