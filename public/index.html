<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today AI - OpenCode Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex overflow-hidden">
    <!-- 登入畫面 -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 w-full max-w-sm shadow-2xl">
            <div class="flex items-center space-x-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white">T</div>
                <div>
                    <h2 class="text-lg font-bold">Today AI 登入</h2>
                    <p class="text-xs text-slate-400">請輸入帳號與密碼</p>
                </div>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-400">帳號</label>
                    <input id="login-username" type="text" autocomplete="username" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-indigo-500" placeholder="username">
                </div>
                <div>
                    <label class="text-xs text-slate-400">密碼</label>
                    <input id="login-password" type="password" autocomplete="current-password" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-indigo-500" placeholder="password">
                </div>
                <div id="login-error" class="text-xs text-red-400 hidden"></div>
                <button onclick="doLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition">登入</button>
            </div>
        </div>
    </div>

    <!-- 側邊欄 -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 hidden md:flex">
        <div>
            <div class="flex items-center space-x-3 px-2 mb-6">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">T</div>
                <span class="text-lg font-bold tracking-wide">Today AI</span>
            </div>
            <button onclick="createNewSession()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-xl flex items-center justify-center space-x-2 transition mb-4 shadow-lg shadow-indigo-600/20">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>新對話</span>
            </button>
            <div class="flex items-center justify-between px-2 mb-2">
                <span class="text-xs font-semibold text-slate-400 tracking-wider">歷史對話</span>
                <span id="session-count" class="text-xs text-slate-500"></span>
            </div>
            <div id="session-list" class="space-y-1 overflow-y-auto max-h-[40vh] pr-1 mb-3">
                <div class="text-xs text-slate-500 px-2 py-2">載入中...</div>
            </div>
            <nav class="space-y-1 border-t border-slate-800 pt-3">
                <div class="text-xs font-semibold text-slate-500 px-2 mb-1">工具</div>
                <a href="#" class="flex items-center space-x-3 px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800/50 text-xs">
                    <i data-lucide="github" class="w-3.5 h-3.5"></i><span>GitHub MCP</span>
                </a>
                <a href="#" class="flex items-center space-x-3 px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800/50 text-xs">
                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i><span>Calendar & Gmail</span>
                </a>
            </nav>
        </div>
        <div class="border-t border-slate-800 pt-4 flex items-center space-x-3 px-2">
            <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-sm font-semibold">OC</div>
            <div class="flex-1 overflow-hidden">
                <p class="text-sm font-medium truncate">OpenCode Engine</p>
                <p class="text-xs text-emerald-400 truncate">● MCP Active</p>
            </div>
        </div>
    </aside>

    <!-- 主區域 -->
    <main class="flex-1 flex flex-col h-full bg-slate-950 relative">
        <header class="h-16 border-b border-slate-800/60 flex items-center justify-between px-6 bg-slate-950/80 backdrop-blur">
            <div class="flex items-center space-x-2 text-sm text-slate-400">
                <span id="current-date"></span>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-xs px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">OpenCode + MCP</span>
                <button onclick="doLogout()" class="text-xs px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">登出</button>
            </div>
        </header>

        <!-- 對話/卡片區 -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-6 max-w-3xl w-full mx-auto space-y-6">
            <div id="welcome-section" class="text-center my-8 space-y-3">
                <h1 class="text-3xl font-bold tracking-tight text-slate-100">早安，今天想處理什麼任務？</h1>
                <p class="text-slate-400 text-sm">選擇快速功能，或直接用自然語言交給 OpenCode 處理。</p>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-6 text-left">
                    <div onclick="usePrompt('查詢我今天的 Google Calendar 行程，並整理出待辦事項')" class="p-4 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 cursor-pointer transition group">
                        <i data-lucide="calendar" class="w-5 h-5 text-indigo-400 mb-2 group-hover:scale-110 transition"></i>
                        <div class="text-sm font-semibold text-slate-200">今日行程檢查</div>
                        <div class="text-xs text-slate-400 mt-1">讀取 Google Calendar 整理今日行程</div>
                    </div>
                    <div onclick="usePrompt('檢查 GitHub Repo 上標記為 bug 的 Issue，並試著修復程式碼')" class="p-4 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 cursor-pointer transition group">
                        <i data-lucide="git-pull-request" class="w-5 h-5 text-emerald-400 mb-2 group-hover:scale-110 transition"></i>
                        <div class="text-sm font-semibold text-slate-200">GitHub Bug 修復</div>
                        <div class="text-xs text-slate-400 mt-1">讀取 Issue 並直接改動本地程式碼</div>
                    </div>
                    <div onclick="usePrompt('寫一封今日工作進度摘要信件，準備寄給團隊')" class="p-4 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 cursor-pointer transition group">
                        <i data-lucide="mail" class="w-5 h-5 text-amber-400 mb-2 group-hover:scale-110 transition"></i>
                        <div class="text-sm font-semibold text-slate-200">撰寫進度郵件</div>
                        <div class="text-xs text-slate-400 mt-1">透過 Gmail MCP 起草與發送郵件</div>
                    </div>
                </div>
            </div>

            <div id="messages" class="space-y-4"></div>
        </div>

        <!-- 輸入框 -->
        <div class="p-4 max-w-3xl w-full mx-auto">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-2 shadow-2xl focus-within:border-indigo-500/50 transition">
                <textarea id="user-input" rows="2" placeholder="輸入指令，例如：『重構 src/server.js 程式碼，增加日誌記錄』..." class="w-full bg-transparent text-slate-100 placeholder-slate-500 resize-none outline-none px-3 pt-2 text-sm"></textarea>
                <div class="flex items-center justify-between pt-2 border-t border-slate-800/50 px-2">
                    <span class="text-xs text-slate-500">提示：Enter 發送，Shift+Enter 換行</span>
                    <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-xl transition flex items-center justify-center">
                        <i data-lucide="arrow-up" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="/app.js" defer></script>
</body>
</html>
